# Déploiement (machine de la salle) : un seul conteneur, la base est chez Neon.
# DATABASE_URL et SECRET_KEY sont lus dans le fichier .env (jamais publié sur GitHub).
#
# Lancer :  docker compose -f docker-compose.prod.yml up -d --build
# Arrêter : docker compose -f docker-compose.prod.yml down
services:
  web:
    build: .
    container_name: tvinsight_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5000}:5000"
    env_file:
      - .env
    command: gunicorn -b 0.0.0.0:5000 -w 2 --timeout 60 app:app
